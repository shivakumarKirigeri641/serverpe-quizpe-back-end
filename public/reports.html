<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <link rel="icon" type="image/png" href="/assets/logo-mark.png" />
  <link rel="apple-touch-icon" href="/assets/logo-mark.png" />
  <title>QuizPe — My Reports</title>
  <!-- WhatsApp is retired (2026-10-08), so the code this page used to send on
       WhatsApp can no longer arrive. Reports now live in the parent's account
       at quizpe.in/app (signed in by SMS code); this page only points there. -->
  <style>
    :root { --brand:#008069; --accent:#00a884; --bg:#efeae2; --card:#fff; --text:#111b21; --muted:#667781; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:var(--bg); color:var(--text); min-height:100vh; padding:0 0 24px; }
    .head { background:var(--brand); color:#fff; padding:16px; display:flex; align-items:center; gap:12px; }
    .head h1 { margin:0; font-size:17px; }
    .head p { margin:3px 0 0; font-size:12px; opacity:.9; }
    .wrap { max-width:520px; margin:0 auto; padding:14px 12px; }
    .card { background:var(--card); border-radius:14px; padding:22px 18px; box-shadow:0 2px 10px rgba(0,0,0,.06); text-align:center; }
    .card p { color:var(--muted); font-size:14px; line-height:1.5; }
    .btn { display:inline-block; margin-top:8px; padding:13px 26px; border-radius:22px; background:var(--accent); color:#fff; font-size:15px; font-weight:700; text-decoration:none; }
    .foot { text-align:center; font-size:11px; color:var(--muted); padding:16px; }
  </style>
</head>
<body>
  <div class="head">
    <img src="/assets/logo-mark.png" alt="QuizPe" style="width:40px;height:40px;border-radius:9px;background:#fff;padding:2px;" />
    <div><h1>📊 My Quiz Reports</h1><p>Now in your QuizPe account</p></div>
  </div>
  <div class="wrap">
    <div class="card">
      <h2 style="margin:0 0 8px;font-size:18px;">Your reports have moved</h2>
      <p>Every quiz report and invoice is now in your QuizPe account. Sign in with your mobile number — we send a one-time code by SMS.</p>
      <a class="btn" id="go" href="https://quizpe.in/app">Open my QuizPe</a>
    </div>
    <div class="foot">QuizPe · Small quiz, Big progress</div>
  </div>
<script>
  if (!/quizpe\.in$/.test(location.hostname)) document.getElementById("go").href = "http://localhost:5174/app";
</script>
</body>
</html>
